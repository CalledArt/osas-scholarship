# Offline mode: swaps Supabase for a postgres container so the app runs with no
# internet at all.
#
#   docker compose -f docker-compose.yml -f docker-compose.offline.yml up
#
# The local database starts empty. Once, to set it up:
#
#   docker compose -f docker-compose.yml -f docker-compose.offline.yml \
#     exec app php artisan migrate --seed --force
#
# This is a second, separate dataset. It will drift from Supabase, and nothing
# syncs between them.

services:
  app:
    environment:
      # The only thing this override changes. Everything else — the localhost
      # URLs, the non-secure cookie — is already the base file's behaviour.
      DB_URL: pgsql://${POSTGRES_USER:-osas}:${POSTGRES_PASSWORD:-osas}@postgres:5432/${POSTGRES_DB:-osas}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-osas}
      POSTGRES_USER: ${POSTGRES_USER:-osas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-osas}
    volumes:
      - osas-postgres:/var/lib/postgresql/data
    ports:
      # Loopback only: these are throwaway local credentials, not a service to
      # expose on the network.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-osas} -d ${POSTGRES_DB:-osas}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  osas-postgres:
